<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Brion Assistant</title>
    <style>
        /* Basic styling for the chat interface */
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="message-display"></div>
        <input type="text" id="message-input" placeholder="Type your code request...">
        <button id="send-button">Send</button>
    </div>
    <script>
        document.getElementById('send-button').addEventListener('click', sendMessage);
        
        // Messages are added with textContent, never innerHTML: generated code
        // routinely contains markup, and innerHTML would execute it.
        function append(display, className, text, pre) {
            const div = document.createElement('div');
            div.className = className;
            const body = document.createElement(pre ? 'pre' : 'span');
            body.textContent = text;
            div.appendChild(body);
            display.appendChild(div);
        }

        function sendMessage() {
            const input = document.getElementById('message-input').value;
            const display = document.getElementById('message-display');
            append(display, 'user-message', input, false);

            fetch('/generate_code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: input})
            })
            .then(response => response.json())
            .then(data => {
                append(display, 'assistant-message', data.error || data.code, true);
                if (data.missing_packages && data.missing_packages.length) {
                    append(display, 'assistant-message',
                           'Missing packages: ' + data.missing_packages.join(', '), false);
                }
            })
            .catch(err => append(display, 'assistant-message', 'Request failed: ' + err, false));
        }
    </script>
</body>
</html>
